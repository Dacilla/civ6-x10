# Release manifest (Phase 7C.3) — single source of truth for release assembly.
#
# Provenance split (do not conflate):
# - semantic_registry_commit: froze the 1010 gameplay semantic registry
#   (Phase 6B; validated by tag phase6b-1010-live-validated).
# - controller_release_commit: civ6-x10 commit whose controller/runtime
#   tree (controller/, dependencies/, release/staging-src/) is byte-equal
#   to the live-validated RC2 staging. Verified via git tree equality.
# - ce_commit: CE fork commit of the exact corresponding source for the
#   distributed DLL (preset/custom/bool readers).
# - release_source_head: content-closure commit of THIS release cycle,
#   recorded by a manifest-sync follow-up (which changes nothing else);
#   per-export heads additionally recorded in PROVENANCE.md files.
# Asserted by tests/test_release_freeze.py (freeze pins) and
# tests/test_release_candidate.py (schema + assembly invariants).
# Public URLs are PLANNED placeholders in RC mode only
# (see PLANNED-PLACEHOLDER markers in staging-src/*/SOURCE.txt).
#
# hash_normalization: LF. All text-file sha256 values below are
# LF-normalized (universal-newlines read), identical on CRLF and LF
# checkouts. Live Windows packaging bytes hash differently (bridge CRLF
# d0faabfa..., registry CRLF f42c6a61...); the assembler normalizes
# before comparing and records packaged bytes separately in
# CHECKSUMS.sha256.
