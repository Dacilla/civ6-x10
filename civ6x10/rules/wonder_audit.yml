wonders:
  BUILDING_ALHAMBRA:
    disposition: PARTIAL
    rows:
    - modifier_id: ALHAMBRA_MILITARY_GOVERNMENT_SLOT
      argument: GovernmentSlotType
      official: SLOT_MILITARY
      disposition: EXCLUDED
      mechanism: NONE
      rationale: extra military policy slot is structural capacity, not a magnitude
    direct:
    - table: Buildings
      key: Entertainment
      value: 2
      disposition: BRIDGED_NUMERIC
      mechanism: ADDITIVE
      rationale: flat entertainment via single-city ENTERTAINMENT helper (Thermal
        Bath precedent, attached to its own building via BuildingModifiers); local
        only (RegionalRange=0); regional-scope cells excluded
    - table: Buildings
      key: GrantFortification
      value: 2
      disposition: EXCLUDED
      mechanism: NONE
      rationale: fortification grant is structural defense capacity, not a magnitude
    - table: Buildings
      key: DefenseModifier
      value: 4
      disposition: EXCLUDED
      mechanism: NONE
      rationale: defense rating kept conservative; no certified ×10 semantics
    - table: Building_GreatPersonPoints
      key: GREAT_PERSON_CLASS_GENERAL
      value: 2
      disposition: BRIDGED_COUNT_LIKE
      mechanism: ADDITIVE
      rationale: 'whole great-person points via single-city GPP helper (Divine Spark
        precedent: same effect EFFECT_ADJUST_GREAT_PERSON_POINTS and collection COLLECTION_OWNER
        with building scope via BUILDING_IS_LIBRARY; per-city owner-pooled flow unchanged,
        no category-sensitive downstream change); integral results only'
