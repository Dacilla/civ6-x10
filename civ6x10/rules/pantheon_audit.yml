# Pantheon semantic audit (Phase 2). One explicit disposition per production
# row: no Pantheon falls through generic heuristics silently. Category and
# mixed-override machinery is reused only where the recorded rationale
# genuinely applies; every row below was inspected individually against the
# official database. Dispositions: CERTIFIED_NUMERIC, CERTIFIED_COUNT_LIKE,
# EXCLUDED (with reason). Belief-level rollup: COMPLETE (all numerics
# certified) | PARTIAL (some numeric excluded, noted).
