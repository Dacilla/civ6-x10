# Argument names that are indivisible regardless of effect.
count_like_args: [TurnsActive, Duration, Turns, Charges, SpreadCharges,
  BuilderCharges, Spreads, NumSlots]

# ---------------------------------------------------------------------------
# Engine-representability overrides (Phase 3F): effects that consume Amount as
# an INTEGER at the application layer, independent of conceptual semantics.
# Rows keep their additive family/kind but gain the mandatory runtime integral
# gate (countLike): a fractional result is REFUSED (the definition keeps its
# official value) instead of being silently truncated by the engine.
# Never floor, ceil or round.
#
# Evidence for EFFECT_ADJUST_BUILDING_YIELD_CHANGE:
#   * live (Phase 3E): bridge helper Amount 14.6 was stored in the definition
#     store (stored_after_add=14.6 MATCH) yet the same city's Faith read back
#     exactly 14.0000 -> truncation at application, not UI rounding (a float
#     readback of 14.6 would have printed 14.6000), and 14.6 -> 14 (not 15)
#     rules out rounding.
#   * static: all 12 official MODIFIER_BUILDING_YIELD_CHANGE definitions carry
#     integral Amounts (2, 3, 4) while the ModifierArguments schema elsewhere
#     does hold fractions (0.5, 0.6, -0.5, 0.2), so the integral domain is a
#     property of this effect rather than of the schema.
#   * no exact-equivalent fractional building-scoped effect exists: the only
#     other carrier of this effect (MODIFIER_PLAYER_CITIES_ADJUST_BUILDING_
#     YIELD_CHANGE) is player-scoped, and the city-scoped
#     MODIFIER_SINGLE_CITY_ADJUST_YIELD_CHANGE changes the affected object
#     from the building to the city, so building equivalence is unproven.
#
# Scope: the direct-table Building_YieldChanges bridge helpers plus, since
# Phase 3G, every production entry of the same engine effect under the
# player-cities carrier (MODIFIER_PLAYER_CITIES_ADJUST_BUILDING_YIELD_CHANGE:
# 21 live-validated Release-1 rows - Ikanda, Third Alternative, Military
# Research). Both carriers dispatch EFFECT_ADJUST_BUILDING_YIELD_CHANGE, so the
# integral application applies identically; entries are keyed by modifier type,
# never broadened by EffectType alone.
# ---------------------------------------------------------------------------
engine_integral_effects:
  - modifier_type: MODIFIER_BUILDING_YIELD_CHANGE
    effect: EFFECT_ADJUST_BUILDING_YIELD_CHANGE
    argument: Amount
    rationale: "integral building-yield application (Phase 3F live+static evidence below); additive family preserved, integral engine representation enforced by refusal"
  - modifier_type: MODIFIER_PLAYER_CITIES_ADJUST_BUILDING_YIELD_CHANGE
    effect: EFFECT_ADJUST_BUILDING_YIELD_CHANGE
    argument: Amount
    rationale: "same engine effect (DynamicModifiers maps this carrier to EFFECT_ADJUST_BUILDING_YIELD_CHANGE, so the integral application applies identically); Phase 3G extends the gate to the 21 live-validated Release-1 rows (8 TRAIT_IKANDA_*, 10 THIRDALTERNATIVE_*, 3 MILITARYRESEARCH_*; official 1/2/4) that were deliberately left ungated in Phase 3F"
  - modifier_type: MODIFIER_GOVERNOR_ADJUST_FEATURE_NO_IMPROVEMENT_APPEAL
    effect: EFFECT_ADJUST_FEATURE_NO_IMPROVEMENT_APPEAL_GOVERNOR
    argument: Amount
    rationale: "governor appeal rating (Forestry Management) is a whole appeal level: the engine represents appeal integrally, so 1 x 7.3 must refuse and keep vanilla 1 while 1 x 10 writes 10 (Phase 4B); appeal is a left-anchored whole-level count, not a continuous yield"

# Exact strong-family overrides (Phase 6A.3). Narrow escape hatch for the
# case where a coarse semantic-floor heuristic classified a whole EffectType
# family as a strong exclusion, but one numeric argument was positively
# reviewed. Each entry matches ONLY its (effect, argument, expected floor
# family, proposed family) quadruple; anything else fails closed in
# certification._strong_family_override. Consulted after excluded_effects
# (which keeps precedence) and floor resolution, before ordinary logic.
strong_family_overrides:
  - effect: EFFECT_GRANT_CITY_YIELD_PERCENT_BUILDING_CREATED_COST
    argument: BuildingProductionPercent
    expected_floor_family: GRANT_OBJECT
    proposed_family: PERCENT_BONUS
    kind: ADDITIVE
    rationale: "argument is explicitly BuildingProductionPercent; Citadel +25
      and Ayutthaya +10 with Ramses signed -15/+30 siblings prove a scalar
      percent-of-building-cost parameter; object selectors and IncludeWonder
      are separate arguments and do not ride along (Phase 6A evidence)"
  # Phase 8B one-shot yield bursts (Great Person activations, city
  # projects, papal pressure). Each Amount is a countable flat quantity of
  # yield/pressure/production granted by one activation or completion --
  # the same "genuine countable quantity" logic as the wonder grants.
  # Eureka/tech-boost objects, relics, envoy grants, and -1 sentinels stay
  # excluded (established precedent); plot-coupled resource grants and
  # regional-range auras are deferred with reasons in docs/PHASE_8B.md.
  - effect: EFFECT_GRANT_YIELD
    argument: Amount
    expected_floor_family: GRANT_OBJECT
    proposed_family: FLAT_YIELD
    kind: ADDITIVE
    count_like: false
    rationale: "one-shot Great Person yield bursts (Adam Smith 500 gold,
      Colaeus 100 faith); flat magnitudes; 8B audit"
  - effect: EFFECT_GRANT_PRODUCTION_IN_CITY
